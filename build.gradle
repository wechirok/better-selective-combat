plugins {
    id 'java-base'
    id 'net.fabricmc.fabric-loom' version '1.18.0-alpha.16' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.18.0-alpha.16' apply false
    id 'net.neoforged.moddev' version '2.0.147' apply false
    id 'net.neoforged.moddev.legacyforge' version '2.0.147' apply false
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}

group = 'dev.wechirok.betterselectivecombat'
version = '1.1.0'

def targets = [
        'mc1211-fabric'   : [loader: 'fabric', minecraft: '1.21.1', publishVersions: ['1.21.1'], minecraftRange: '=1.21.1', java: 21, fabricApi: '0.116.15+1.21.1', neoForge: null, betterCombat: '2.4.0+1.21.1', betterCombatRange: '>=2.4.0 <3.0.0'],
        'mc1211-neoforge' : [loader: 'neoforge', minecraft: '1.21.1', publishVersions: ['1.21.1'], minecraftRange: '[1.21.1]', java: 21, fabricApi: null, neoForge: '21.1.248', betterCombat: '2.4.0+1.21.1', betterCombatRange: '[2.4.0,3.0.0)'],
        'mc1214-fabric'   : [loader: 'fabric', minecraft: '1.21.4', publishVersions: ['1.21.4'], minecraftRange: '=1.21.4', java: 21, fabricApi: '0.119.4+1.21.4', neoForge: null, betterCombat: '2.3.0+1.21.4', betterCombatRange: '>=2.3.0 <3.0.0'],
        'mc1214-neoforge' : [loader: 'neoforge', minecraft: '1.21.4', publishVersions: ['1.21.4'], minecraftRange: '[1.21.4]', java: 21, fabricApi: null, neoForge: '21.4.157', betterCombat: '2.3.0+1.21.4', betterCombatRange: '[2.3.0,3.0.0)'],
        'mc1218-fabric'   : [loader: 'fabric', minecraft: '1.21.8', publishVersions: ['1.21.6', '1.21.7', '1.21.8'], minecraftRange: '>=1.21.6 <=1.21.8', java: 21, fabricApi: '0.136.1+1.21.8', neoForge: null, betterCombat: '3.0.1+1.21.8', betterCombatRange: '>=3.0.0 <3.2.0'],
        'mc1218-neoforge' : [loader: 'neoforge', minecraft: '1.21.8', publishVersions: ['1.21.6', '1.21.7', '1.21.8'], minecraftRange: '[1.21.6,1.21.9)', java: 21, fabricApi: null, neoForge: '21.8.54', betterCombat: '3.0.1+1.21.8', betterCombatRange: '[3.0.0,3.2.0)'],
        'mc12110-fabric'  : [loader: 'fabric', minecraft: '1.21.10', publishVersions: ['1.21.9', '1.21.10'], minecraftRange: '>=1.21.9 <=1.21.10', java: 21, fabricApi: '0.138.4+1.21.10', neoForge: null, betterCombat: '3.0.0+1.21.10', betterCombatRange: '>=3.0.0 <3.2.0'],
        'mc12110-neoforge': [loader: 'neoforge', minecraft: '1.21.10', publishVersions: ['1.21.9', '1.21.10'], minecraftRange: '[1.21.9,1.21.11)', java: 21, fabricApi: null, neoForge: '21.10.64', betterCombat: '3.0.0+1.21.10', betterCombatRange: '[3.0.0,3.2.0)'],
        'mc12111-fabric'  : [loader: 'fabric', minecraft: '1.21.11', publishVersions: ['1.21.11'], minecraftRange: '=1.21.11', java: 21, fabricApi: '0.141.6+1.21.11', neoForge: null, betterCombat: '3.1.0+1.21.11', betterCombatRange: '>=3.0.0 <3.2.0'],
        'mc12111-neoforge': [loader: 'neoforge', minecraft: '1.21.11', publishVersions: ['1.21.11'], minecraftRange: '[1.21.11]', java: 21, fabricApi: null, neoForge: '21.11.45', betterCombat: '3.1.0+1.21.11', betterCombatRange: '[3.0.0,3.2.0)'],
        'mc261-fabric'    : [loader: 'fabric', minecraft: '26.1.2', publishVersions: ['26.1', '26.1.1', '26.1.2'], minecraftRange: '>=26.1 <=26.1.2', java: 25, fabricApi: '0.155.2+26.1.2', neoForge: null, betterCombat: '3.2.2+26.1.2', betterCombatRange: '>=3.2.0 <3.3.0'],
        'mc261-neoforge'  : [loader: 'neoforge', minecraft: '26.1.2', publishVersions: ['26.1', '26.1.1', '26.1.2'], minecraftRange: '[26.1,26.1.3)', java: 25, fabricApi: null, neoForge: '26.1.2.97', betterCombat: '3.2.2+26.1.2', betterCombatRange: '[3.2.0,3.3.0)'],
        'mc262-fabric'    : [loader: 'fabric', minecraft: '26.2', publishVersions: ['26.2'], minecraftRange: '=26.2', java: 25, fabricApi: '0.158.0+26.2', neoForge: null, betterCombat: '3.2.2+26.2', betterCombatRange: '>=3.2.0 <3.3.0'],
        'mc262-neoforge'  : [loader: 'neoforge', minecraft: '26.2', publishVersions: ['26.2'], minecraftRange: '[26.2]', java: 25, fabricApi: null, neoForge: '26.2.0.66', betterCombat: '3.2.2+26.2', betterCombatRange: '[3.2.0,3.3.0)']
]

def legacyTargets = [
        'mc1182': [minecraft: '1.18.2', games: ['1.18.2'], fabricApi: '0.77.0+1.18.2', forge: '1.18.2-40.2.21', betterCombat: '1.6.2+1.18.2'],
        'mc1192': [minecraft: '1.19.2', games: ['1.19', '1.19.1', '1.19.2'], fabricApi: '0.77.0+1.19.2', forge: '1.19.2-43.3.0', betterCombat: '1.7.1+1.19'],
        'mc1193': [minecraft: '1.19.3', games: ['1.19.3'], fabricApi: '0.76.1+1.19.3', forge: '1.19.3-44.1.0', betterCombat: '1.7.1+1.19.3'],
        'mc1194': [minecraft: '1.19.4', games: ['1.19.4'], fabricApi: '0.87.2+1.19.4', forge: '1.19.4-45.2.0', betterCombat: '1.7.1+1.19.4'],
        'mc1201': [minecraft: '1.20.1', games: ['1.20', '1.20.1'], fabricApi: '0.92.12+1.20.1', forge: '1.20.1-47.3.0', betterCombat: '1.9.0+1.20.1'],
        'mc1202': [minecraft: '1.20.2', games: ['1.20.2'], fabricApi: '0.91.6+1.20.2', forge: '1.20.2-48.1.0', betterCombat: '1.8.1+1.20.2'],
        'mc1204': [minecraft: '1.20.4', games: ['1.20.4'], fabricApi: '0.97.3+1.20.4', neoForge: '20.4.251', betterCombat: '1.9.0+1.20.4']
]
legacyTargets.each { name, spec ->
    ['fabric', spec.neoForge ? 'neoforge' : 'forge'].each { loader ->
        def first = spec.games.first()
        def last = spec.games.last()
        targets["${name}-${loader}"] = [
                loader: loader, minecraft: spec.minecraft, publishVersions: spec.games,
                minecraftRange: loader == 'fabric'
                        ? ">=${first} <=${last}"
                        : first == last ? "[${first}]" : "[${first},${last}]",
                java: 17, fabricApi: spec.fabricApi, forge: spec.forge, neoForge: spec.neoForge,
                betterCombat: name == 'mc1202' && loader == 'forge' ? '1.8.5+1.20.2' : spec.betterCombat,
                betterCombatRange: loader == 'fabric' ? '>=1.6.2 <2.0.0' : '[1.6.2,2.0.0)',
                legacy: true,
                publishLoaders: name == 'mc1201' && loader == 'forge' ? ['forge', 'neoforge'] : [loader]
        ]
    }
}
['fabric', 'neoforge'].each { loader ->
    targets["mc121-${loader}"] = targets["mc1211-${loader}"] + [
            minecraft: '1.21', publishVersions: ['1.21'],
            minecraftRange: loader == 'fabric' ? '=1.21' : '[1.21]',
            fabricApi: '0.102.0+1.21', neoForge: '21.0.167'
    ]
    targets["mc263-${loader}"] = targets["mc262-${loader}"] + [
            minecraft: '26.3', publishVersions: ['26.3'],
            minecraftRange: loader == 'fabric' ? '=26.3' : '[26.3]',
            fabricApi: '0.161.0+26.3', neoForge: '26.3.0.7-beta', betterCombat: '3.2.2+26.3'
    ]
}
def selectedTargets = providers.gradleProperty('targets').map { it.split(',').toList() }.orElse(targets.keySet().toList()).get()
if (!targets.keySet().containsAll(selectedTargets)) {
    throw new GradleException("Unknown build targets: ${selectedTargets - targets.keySet()}")
}
targets = targets.findAll { name, target -> name in selectedTargets }

subprojects {
    def target = targets[project.name]
    group = rootProject.group
    version = rootProject.version

    apply plugin: 'java-library'
    if (target.loader == 'fabric') {
        apply plugin: target.minecraft.startsWith('26.') ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
    } else if (target.loader == 'forge') {
        apply plugin: 'net.neoforged.moddev.legacyforge'
    } else {
        apply plugin: 'net.neoforged.moddev'
    }

    base {
        archivesName = "betterselectivecombat-${target.loader}"
    }

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(target.java)
        withSourcesJar()
    }

    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net' }
        maven { url = 'https://api.modrinth.com/maven' }
    }

    sourceSets {
        main {
            def oldMinecraft = target.legacy || target.minecraft in ['1.21', '1.21.1', '1.21.4', '1.21.8']
            def permissionSources = oldMinecraft
                    ? 'src/minecraft-legacy/java'
                    : target.minecraft == '1.21.10'
                    ? 'src/minecraft-1.21.10/java'
                    : 'src/minecraft-modern/java'
            java.srcDirs = [
                    rootProject.file('src/common/java'),
                    rootProject.file("src/${target.loader}/java"),
                    rootProject.file(permissionSources),
                    rootProject.file(oldMinecraft
                            ? 'src/minecraft-client-legacy/java'
                            : 'src/minecraft-client-modern/java'),
                    rootProject.file(target.legacy || target.minecraft in ['1.21', '1.21.1', '1.21.4']
                            ? 'src/minecraft-inventory-legacy/java'
                            : 'src/minecraft-inventory-modern/java'),
                    rootProject.file(target.minecraft in ['26.2', '26.3']
                            ? 'src/minecraft-client-262/java'
                            : 'src/minecraft-client-pre-262/java')
            ]
            java.srcDir rootProject.file(target.minecraft == '1.18.2'
                    ? 'src/minecraft-1182/java' : 'src/minecraft-text-modern/java')
            java.srcDir rootProject.file(target.minecraft in ['1.18.2', '1.19.2']
                    ? 'src/minecraft-registry-legacy/java' : 'src/minecraft-registry-modern/java')
            java.srcDir rootProject.file(target.minecraft in ['1.18.2', '1.19.2', '1.19.3', '1.19.4']
                    ? 'src/minecraft-command-legacy/java' : 'src/minecraft-command-modern/java')
            java.srcDir rootProject.file(target.legacy && target.minecraft != '1.20.4'
                    && target.minecraft != '1.20.2'
                    ? 'src/minecraft-language-legacy/java' : 'src/minecraft-language-modern/java')
            if (target.loader == 'fabric') {
                java.srcDir rootProject.file(target.minecraft.startsWith('26.')
                        ? 'src/fabric-client-modern/java'
                        : 'src/fabric-client-legacy/java')
                if (target.minecraft == '1.18.2') {
                    java.exclude 'dev/wechirok/betterselectivecombat/fabric/BetterSelectiveCombatFabric.java'
                    java.srcDir rootProject.file('src/fabric-1182/java')
                }
            } else if (target.loader == 'neoforge') {
                java.srcDir rootProject.file(oldMinecraft
                        ? 'src/neoforge-client-legacy/java'
                        : 'src/neoforge-client-modern/java')
            } else {
                java.srcDir rootProject.file(target.minecraft == '1.18.2' ? 'src/forge-1182/java' : 'src/forge-modern/java')
            }
            resources.srcDirs = [rootProject.file('src/common/resources'), rootProject.file("src/${target.loader}/resources")]
        }
    }

    if (target.loader == 'fabric') {
        dependencies {
            minecraft "com.mojang:minecraft:${target.minecraft}"
            if (!target.minecraft.startsWith('26.')) {
                mappings loom.officialMojangMappings()
                modImplementation "net.fabricmc:fabric-loader:0.19.3"
                modImplementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
            } else {
                implementation "net.fabricmc:fabric-loader:0.19.3"
                implementation "net.fabricmc.fabric-api:fabric-api:${target.fabricApi}"
            }
        }
    } else if (target.loader == 'forge') {
        legacyForge {
            enable {
                if (target.neoForge) {
                    neoForgeVersion = target.neoForge
                } else {
                    forgeVersion = target.forge
                }
                disableRecompilation = true
            }
            mods {
                better_selective_combat {
                    sourceSet sourceSets.main
                }
            }
        }
        mixin {
            add sourceSets.main, 'better_selective_combat.refmap.json'
            config 'better_selective_combat.mixins.json'
        }
        dependencies {
            annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
        }
    } else {
        neoForge {
            enable {
                version = target.neoForge
                disableRecompilation = true
            }
            mods {
                better_selective_combat {
                    sourceSet sourceSets.main
                }
            }
            runs {
                server {
                    server()
                    gameDirectory = project.file('run')
                    programArgument '--nogui'
                }
            }
        }
    }

    dependencies {
        compileOnly "maven.modrinth:better-combat:${target.betterCombat}-${target.loader}"
        compileOnly "net.luckperms:api:5.5"
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = target.java
    }

    def resourceProperties = [
            version: project.version.toString(),
            minecraft_version: target.minecraft,
            minecraft_range: target.minecraftRange,
            better_combat_range: target.betterCombatRange,
            java_compatibility: "JAVA_${target.java}",
            fabric_api_id: target.minecraft == '1.18.2' ? 'fabric' : 'fabric-api',
            fabric_entrypoint: target.minecraft == '1.18.2' ? 'BetterSelectiveCombatFabricLegacy' : 'BetterSelectiveCombatFabric',
            legacy_mixins: target.legacy && !(target.minecraft in ['1.20.2', '1.20.4']) ? ', "ServerPlayerLanguageMixin"' : '',
            refmap: target.loader == 'forge' ? '"refmap": "better_selective_combat.refmap.json",' : ''
    ]

    processResources {
        inputs.properties resourceProperties
        filesMatching(['fabric.mod.json', 'META-INF/neoforge.mods.toml', 'META-INF/mods.toml', 'better_selective_combat.mixins.json']) {
            expand resourceProperties
        }
        if (target.minecraft == '1.20.4' && target.loader == 'neoforge') {
            filesMatching('META-INF/neoforge.mods.toml') {
                path = 'META-INF/mods.toml'
            }
        }
    }

    tasks.named('jar', Jar).configure {
        manifest {
            attributes('Implementation-Title': 'better-selective-combat', 'Implementation-Version': project.version)
            if (target.loader == 'forge') {
                attributes('MixinConfigs': 'better_selective_combat.mixins.json')
            }
        }
    }

    tasks.withType(AbstractArchiveTask).configureEach {
        archiveVersion = "${rootProject.version}+${target.minecraft}"
    }

    def artifactTask = target.loader == 'fabric' && !target.minecraft.startsWith('26.')
            ? tasks.named('remapJar')
            : target.loader == 'forge'
            ? tasks.named('reobfJar')
            : tasks.named('jar')
    project.ext.releaseArtifact = artifactTask.flatMap { it.archiveFile }
}

def externalTarget = 'mc1202-forge'
def externalArtifact = layout.projectDirectory.file("versions/1.20.2/forge/build/libs/betterselectivecombat-forge-${version}+1.20.2.jar")
def externalBuild = tasks.register('buildMc1202Forge', Exec) {
    workingDir layout.projectDirectory.dir('versions/1.20.2/forge')
    environment 'JAVA_HOME', javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(17)
    }.get().metadata.installationPath.asFile.absolutePath
    commandLine System.getProperty('os.name').toLowerCase().contains('windows')
            ? ['gradlew.bat', 'clean', 'build', '--no-daemon']
            : ['bash', 'gradlew', 'clean', 'build', '--no-daemon']
    onlyIf { externalTarget in selectedTargets }
}
def releaseArtifactFor = { name ->
    name == externalTarget ? providers.provider { externalArtifact } : project(":${name}").ext.releaseArtifact
}

tasks.register('buildAll') {
    dependsOn selectedTargets.collect { it == externalTarget ? externalBuild : project(":${it}").tasks.named('build') }
}

tasks.register('collectReleaseJars', Sync) {
    dependsOn tasks.named('buildAll')
    into layout.buildDirectory.dir('release')
    from selectedTargets.collect { releaseArtifactFor(it) }
}

def releaseTypeName = (findProperty('release_type') ?: 'release').toString()
def releaseType = releaseTypeName == 'alpha'
        ? me.modmuss50.mpp.ReleaseType.ALPHA
        : releaseTypeName == 'beta'
        ? me.modmuss50.mpp.ReleaseType.BETA
        : me.modmuss50.mpp.ReleaseType.STABLE
def publicationPlan = providers.gradleProperty('publish_plan').map {
    new groovy.json.JsonSlurper().parse(file(it))
}.orElse([:]).get()
def manifestFile = layout.buildDirectory.file('release-manifest.json').get().asFile
def manifestJson = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
        version: version.toString(), modrinth: 'ARaBurjl', curseforge: '1664386',
        targets: targets.collectEntries { name, target ->
            [(name): [file: "betterselectivecombat-${target.loader}-${version}+${target.minecraft}.jar",
                      games: target.publishVersions, loaders: target.publishLoaders ?: [target.loader]]]
        }
]))
tasks.register('writeReleaseManifest') {
    inputs.property('manifest', manifestJson)
    outputs.file(manifestFile)
    doLast {
        manifestFile.parentFile.mkdirs()
        manifestFile.text = manifestJson
    }
}

publishMods {
    changelog = providers.environmentVariable('CHANGELOG').orElse("Release ${rootProject.version}")
    type = releaseType
    dryRun = providers.gradleProperty('dry_run').map { it.toBoolean() }.orElse(false)

    def curseForgeOptions = curseforgeOptions {
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        projectId = '1664386'
        client = true
        server = true
    }
    def modrinthOptions = modrinthOptions {
        accessToken = providers.environmentVariable('MODRINTH_TOKEN')
        projectId = 'ARaBurjl'
        environment = CLIENT_OR_SERVER
    }

    targets.each { name, target ->
        def artifact = releaseArtifactFor(name)
        def releaseName = "${rootProject.version}+${target.minecraft}-${target.loader}"

        if (!publicationPlan || name in publicationPlan.curseforge) {
            curseforge("curseforge-${name}") {
                from curseForgeOptions
                file = artifact
                displayName = releaseName
                version = releaseName
                modLoaders.addAll(target.publishLoaders ?: [target.loader])
                target.publishVersions.each { minecraftVersions.add(it) }
                javaVersions.add(JavaVersion.toVersion(target.java))
                requires('better-combat-by-daedelus')
                optional('luckperms')
                if (target.loader == 'fabric') {
                    requires('fabric-api')
                }
            }
        }

        if (!publicationPlan || name in publicationPlan.modrinth) {
            modrinth("modrinth-${name}") {
                from modrinthOptions
                file = artifact
                displayName = releaseName
                version = releaseName
                modLoaders.addAll(target.publishLoaders ?: [target.loader])
                target.publishVersions.each { minecraftVersions.add(it) }
                requires('better-combat')
                optional('luckperms')
                if (target.loader == 'fabric') {
                    requires('fabric-api')
                }
            }
        }
    }
}

tasks.named('publishMods') {
    dependsOn tasks.named('collectReleaseJars')
}
