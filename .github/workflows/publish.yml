name: publish

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      changelog:
        description: Release changelog
        required: true
        type: string
      targets:
        description: Build targets separated by commas or empty for all
        required: false
        type: string
      replace_targets:
        description: Existing targets to replace after removing their CurseForge files
        required: false
        type: string
      retry_curseforge_targets:
        description: Missing CurseForge targets to retry without republishing elsewhere
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
      - run: python .github/scripts/publish.py
        env:
          CHANGELOG: ${{ inputs.changelog }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          TARGETS: ${{ inputs.targets }}
          REPLACE_TARGETS: ${{ inputs.replace_targets }}
          RETRY_CURSEFORGE_TARGETS: ${{ inputs.retry_curseforge_targets }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
