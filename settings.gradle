pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'better-selective-combat'

def targets = [
        'mc1211-fabric': 'versions/1.21.1/fabric',
        'mc1211-neoforge': 'versions/1.21.1/neoforge',
        'mc1214-fabric': 'versions/1.21.4/fabric',
        'mc1214-neoforge': 'versions/1.21.4/neoforge',
        'mc1218-fabric': 'versions/1.21.8/fabric',
        'mc1218-neoforge': 'versions/1.21.8/neoforge',
        'mc12110-fabric': 'versions/1.21.10/fabric',
        'mc12110-neoforge': 'versions/1.21.10/neoforge',
        'mc12111-fabric': 'versions/1.21.11/fabric',
        'mc12111-neoforge': 'versions/1.21.11/neoforge',
        'mc261-fabric': 'versions/26.1/fabric',
        'mc261-neoforge': 'versions/26.1/neoforge',
        'mc262-fabric': 'versions/26.2/fabric',
        'mc262-neoforge': 'versions/26.2/neoforge'
]

targets.each { name, directory ->
    include name
    project(":${name}").projectDir = file(directory)
}
